name: Independent production Gutenberg computed-style acceptance
on:
  pull_request:
  workflow_dispatch:
jobs:
  production-wordpress-gutenberg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m py_compile scripts/audit-live-wordpress-blocks.py
      - run: python scripts/audit-live-wordpress-blocks.py --self-test
      - run: python scripts/audit-live-wordpress-blocks.py
      - run: python -m py_compile scripts/audit-live-wordpress-recent-parity.py
      - run: CHM_SELF_TEST=1 python scripts/audit-live-wordpress-recent-parity.py
      - run: python scripts/audit-live-wordpress-recent-parity.py
      - run: python -m py_compile scripts/audit-live-print-browser.py
      - run: CHM_SELF_TEST=1 python scripts/audit-live-print-browser.py
      - run: python scripts/audit-live-print-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-production-print-evidence
          path: artifacts/live-print-browser.json
          if-no-files-found: ignore
