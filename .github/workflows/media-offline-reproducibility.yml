name: Verified media offline rebuild and byte reproducibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-media-and-generated-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Warm npm package cache (network permitted only in this phase)
        env:
          npm_config_cache: ${{ runner.temp }}/chm-npm-cache
        run: npm install --no-audit --no-fund
      - name: Validate generated npm lockfile provenance
        run: |
          node scripts/audit-npm-lockfile.mjs --self-test
          node scripts/audit-npm-lockfile.mjs
      - name: Retain generated npm lockfile for independent review
        uses: actions/upload-artifact@v4
        with:
          name: chm-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Reinstall npm dependencies in a network-isolated container
        run: |
          set -eu
          test -s package-lock.json
          cp package-lock.json "$RUNNER_TEMP/chm-npm-lock-before.json"
          docker pull node:22.16.0-bookworm-slim
          rm -rf node_modules
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e npm_config_cache=/npm-cache \
            -v "$PWD:/work" \
            -v "$RUNNER_TEMP/chm-npm-cache:/npm-cache" \
            -w /work node:22.16.0-bookworm-slim \
            sh -ec 'npm ci --offline --no-audit --no-fund && node -e "require(\"sharp\")"'
          cmp package-lock.json "$RUNNER_TEMP/chm-npm-lock-before.json"
          node -e 'require("sharp")'
      - run: node scripts/test-media-source-cache.mjs
      - run: python scripts/compare-build-trees.py --self-test
      - name: Preserve pristine published source tree
        run: cp -a public "$RUNNER_TEMP/chm-pristine-public"
      - name: Build from pinned original WordPress media and populate ephemeral verified cache
        env:
          CHM_MEDIA_CACHE_MODE: populate
        run: |
          CHM_MEDIA_CACHE_DIR="$RUNNER_TEMP/chm-original-media-cache" npm run build
          cp -a public "$RUNNER_TEMP/chm-first-generated"
      - name: Rebuild from pristine source using ONLY cached verified media inputs
        env:
          CHM_MEDIA_CACHE_MODE: offline
        run: |
          rm -rf public
          cp -a "$RUNNER_TEMP/chm-pristine-public" public
          CHM_MEDIA_CACHE_DIR="$RUNNER_TEMP/chm-original-media-cache" npm run build
      - name: Compare every generated byte and path
        run: python scripts/compare-build-trees.py --first "$RUNNER_TEMP/chm-first-generated" --second public
